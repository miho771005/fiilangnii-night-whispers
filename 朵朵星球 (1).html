<script>
/* ---------- 1) 音效：換成你自己的檔案路徑（放在同一個資料夾），留空 '' 就用內建合成音 ---------- */
const SOUND={
  collect:'',   // 蒐集碎片的叮叮聲，例如 'sfx/ding.mp3'
  open:'',      // 打開花朵資訊的柯拉聲，例如 'sfx/open.mp3'
  bgm:''        // 背景音樂，例如 'music/my-song.mp3'；留空 = 安靜
};
/* ---------- 2) 數字設定 ---------- */
const CONFIG={
  textFadeMax:40,   // 文字透明度拉桿最大值(%)
  circleFill:false, // 圓圈底線：false=空心 true=實心
  manyFlowers:[45,60], // 花數量「滿滿」那一檔的範圍（45朵以上）
  
  shardsPerFlower:[10,20],   // 蒐集幾個碎片出一朵花（隨機範圍）
  newChance:0.75,            // 優先抽到還沒有的花的機率
  textChance:0.05,           // 抽到「文字花」的機率（5%）
  flipSlow:2,                // 花朵翻轉變慢的倍數（越大越慢）
  tankMax:25,                // 水族箱最多顯示幾朵
  energyMax:12, energyCost:1,// 光點數量、每朵花消耗
  recoverMs:3600000,         // 每多久回復一顆（1 小時）
  spawnMs:[3000,6000],       // 正常碎片出現間隔
  /* 果實：漂浮上限、漂浮大小(px)。測試版 fruitMax:5 ；正式上線改成 fruitMax:8 */
  fruitMax:5, fruitBox:42,
  /* 【果實三天延遲】正式版 = 3*24*3600000（三天）：按下開場「我看看什麼好東西」那一刻起，三天之內黃小果完全不產出；
     三天後才開始用 FRUITS 裡 ms 的間隔計算（正式版 4～6 小時 ms:[4*3600000,6*3600000]；測試版目前是 4～6 分鐘）。
     測試版目前設 0＝不等待。沒有起點時間的舊存檔（已有花的人）不受延遲影響。 */
  fruitDelayMs:0,
  slowMs:[60000,120000]      // 光點剩最後一顆時的間隔（1~2 分鐘）
};
/* ---------- 3) 花朵模板：只決定「有哪些零件」──花心 center('dot'|'star'|'ring'|'stamen'花蕊|'square'小方塊|'none')、點擊特效 fx('sparkle'閃耀|'jelly'果凍|'fade'霧化|'none')
   花朵自己也可以寫 center / fx 來蓋過模板 ---------- */
const TPL={
  1:{center:'dot', fx:'jelly'},
  2:{center:'star',fx:'sparkle'},
  3:{center:'ring',fx:'sparkle'},
  4:{center:'stamen',fx:'sparkle',leaf:1,line:'#222'},  // 線稿花：細線輪廓＋三個小三角花蕊＋一片獨立的葉子
  5:{center:'square',fx:'fade'},  // 截角花瓣：實心花瓣中間有一條鏤空細縫，花心是小方塊，點擊時整朵花像霧一樣淡出再回來
  6:{center:'none',fx:'jelly'}  // 蕨葉花：主幹＋不規則長葉＋小花點，全部由 fernSvg 畫
};
/* ---------- 3b) 果實模板：全部果實共用這一個 ----------
  輪廓＝四段三次貝茲曲線，順時針 上→右→下→左。果實清單裡每一行可寫：
  r:[rT,rR,rB,rL] 四個半徑（預設圓形）
  k:[[a,b,c,d]×4] 每段 P1=A+a·切線+b·外法線，P2=B−c·切線+d·外法線（不寫＝圓形：a=0.5523×本段起點半徑，c=0.5523×終點半徑，b=d=0）

fb.onclick=()=>{if(!FO.length)return;const F=S.fr,got={},nw={};for(const o of FO){if(!(o.id in F.own))nw[o.id]=1;F.own[o.id]=(F.own[o.id]||0)+1;got[o.id]=(got[o.id]||0)+1}FO=[];F.u=1;fSave();drawFruits();fruitTick();const c=$('#card');c.innerHTML='<div class=cd style="background:#2b2a45;color:#eef"><h3>收好了</h3>'+Object.keys(got).map(i=>`<p>${fById(i).name} × ${got[i]}</p>`).join('')+'<div class=bt><button id=ok>好</button></div></div>';c.style.display='flex';$('#ok').onclick=()=>c.style.display='none';c.onclick=ev=>{if(ev.target==c)c.style.display='none'}};
function cardF(f,n,isNew){const c=$('#card');c.innerHTML=`<div class=cd style="background:${f.bg};color:${f.ink}">${isNew?'<b class=new>new</b>':''}<div class=big>${fruitSvg(f)}</div><h3>${f.name}</h3><p>${f.story}</p><small>我擁有×${n}</small><div class=bt><button id=ok>好</button></div></div>`;c.style.display='flex';$('#ok').onclick=()=>c.style.display='none';c.onclick=ev=>{if(ev.target==c)c.style.display='none'}}
function drawFruits(){document.querySelectorAll('#main .fr').forEach(e=>e.remove());for(const o of FO){const f=fById(o.id),d=document.createElement('div');d.className='fr';d.style.cssText=`left:${o.x}%;top:${o.y}%;width:${CONFIG.fruitBox}px;height:${CONFIG.fruitBox}px;animation-delay:0s,-${rnd(0,6)}s`;d.innerHTML=fruitSvg(f);
  d.onclick=()=>{spark(d,f.c2);FO.splice(FO.indexOf(o),1);d.remove();const F=S.fr,isNew=!(f.id in F.own);F.own[f.id]=(F.own[f.id]||0)+1;F.u=1;fSave();fruitTick();cardF(f,F.own[f.id],isNew)};$('#main').appendChild(d)}fb.style.display=FO.length>=2?'block':'none'}
/* 用上次記錄的時間補算：打開頁面時會一次補上離開期間該長的顆數（不超過上限）；漂浮滿了就暫停，收走後重新計時 */
function fruitTick(){const F=S.fr,n=Date.now();let ch=0;for(const f of FRUITS){if(!S.own[f.need])continue;if(F.start&&n<F.start+CONFIG.fruitDelayMs)continue;/* 開場送花後的延遲期：不計時、不產出 */if(F.next[f.id]==null){if(FO.length>=CONFIG.fruitMax)continue;F.next[f.id]=n+rnd(...f.ms)}
  while(F.next[f.id]!=null&&F.next[f.id]<=n){if(FO.length>=CONFIG.fruitMax){delete F.next[f.id];break}FO.push(fPos(f.id));ch=1;F.next[f.id]+=rnd(...f.ms)}}
 if(ch){fSave();drawFruits()}else save()}
$('#sback').onclick=()=>{sv=null;renderStore()};addEventListener('visibilitychange',()=>{if(!document.hidden)fruitTick()});
drawFruits();fruitTick();setInterval(fruitTick,5000);
/* ╔════════════════════════════════════════════════════════════════════╗
   ║  ★★★ 【開場 / 說說】文字與程式全部在這一區（搜尋「開場」）★★★      ║
   ║  first＝開場原稿（空行隔開＝逐句的一句）  after＝送花之後那三行      ║
   ║  replay2＝說說裡第二頁   S.intro＝看過開場的永久標記               ║
   ╚════════════════════════════════════════════════════════════════════╝ */
const INTRO={
 title:'朵朵兒夜絮語', skip:'不要囉嗦，\n一次給我說完', cont:'請繼續說', cont2:'你慢慢說，我聽著', askAt:'你知道這裡有什麼嗎', btn:'我看看什麼好東西',
 mailTitle:'踏上了朵朵星球', replayBtn:'我好像拿過花花了', replay2Btn:'好吧，我知道了',
 first:`
會來到這個朵朵星球的你，一定是個「不一樣」的。

剛剛你在想什麼？
這裡沒有經驗值，沒有倒數計時，沒有一大堆禮包，沒有打怪，沒有賣錢，什麼都沒有。

你知道這裡有什麼嗎？

有花花，
還有一些不知道是什麼的。

有屬於你的色彩，屬於你的收藏。

沒有換一個顏色就更強的異色裝備。
沒有教學，沒有新手大禮包買到賺到。

沒有驚心動魄讓人胃痛的厲害故事。
沒有自動尋路中。

這裡，只有你自己。
你紀錄的，自己的每一天。

如果不想記錄，你心想：去你的日記！那也完全沒關係。（笑）

請進。
這是送你的第一朵花花。
`,
 after:`
啊，忘了說。
沒辦法丟掉他的。
不喜歡的話，可以收起來。（笑）
`,
 replay2:`
拿過花花了對吧？
我暫時不能告訴你之後有什麼。

因為在這裡，看到就代表擁有了。
如果沒看到，代表不存在。

這裡夜很深了，往後還有很多路要走
抱歉呀，沒有給你什麼很好的東西

這個星球就是這樣的。

好東西其實都在你的心裡
他們還在成長。
給夜晚和自己一點點時間吧。
`
};
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const IN=$('#intro');var mv=0;
/* 整頁文字一次顯示 + 最下面一顆按鈕 */
function introFull(host,txt,label,fn){host.textContent='';const b=mk('button','ib',label);b.onclick=fn;host.append(mk('div','itx',txt.trim()),b)}
/* 說說（類似遊戲信箱）：第一格＝踏上了朵朵星球 */
const mailById=id=>S.mail.list.find(x=>x.id==id),mailLetter=id=>LETTERS.find(x=>x.id==id);let mailCur=null;
/* 已讀：只會從未讀變已讀，不會變回去；ro＝第幾個被讀的（用計數，不看時鐘，所以時間往回調也不會亂） */
function mailRead(id){const m=mailById(id);if(!m||m.r)return;m.r=1;m.ro=++S.mail.rc;save()}
/* 條件達成 → 進信箱（每封只進一次）。收花／收果的卡片還開著就先等，關掉之後才進；不用時間判斷任何事 */
function mailCheck(){if($('#card').style.display=='flex')return;let ch=0;
 for(const l of LETTERS){if(mailById(l.id))continue;let ok=0;try{ok=l.when()}catch(e){}if(!ok)continue;
  const m={id:l.id,t:Date.now(),r:l.read?1:0};if(m.r)m.ro=++S.mail.rc;S.mail.list.push(m);ch=1}
 if(ch){save();if(page=='mailP'&&mv==0)renderMail()}}
/* 讀信（跟第一封同一套演出）：空行＝換下一句，點哪裡都繼續；
   整段被（）包起來＝上一句底下的「玩家回應按鈕」（假按鈕，點哪裡都算按）；最後一段的按鈕＝結尾，按了才算已讀。
   背景用信件的 hue 微調色相（不寫＝同開場） */
function openLetter(id){const l=mailLetter(id);if(!l)return;mailCur=id;
 if(l.intro){mv=1;renderMail();return}
 letterPlay(l)}
function letterPlay(l){IN.textContent='';IN.classList.add('on');
 IN.style.background=l.hue==null?'':`linear-gradient(hsl(${l.hue} 22% 20%),hsl(${l.hue+4} 23% 36%) 55%,hsl(${l.hue+32} 14% 39%))`;
 const P=[];l.body.trim().split(/\n\s*\n/).forEach(p=>{const t=p.trim(),q=P[P.length-1];if(/^（[\s\S]*）$/.test(t)&&q&&q.b==null)q.b=t.slice(1,-1);else P.push({t:t,b:null})});
 const n=P.length,end=P[n-1].b||l.end||'收起來',body=mk('div','ibody'),s=mk('div','istep'),pill=mk('button','ib'),skip=mk('button','ib isk',INTRO.skip);
 let i=0,busy=false,full=false;
 const fin=()=>{IN.classList.remove('on');IN.style.background='';IN.onclick=null;mailRead(l.id);renderMail()};
 const put=()=>{s.textContent=P[i].t;s.className='istep';setTimeout(()=>s.classList.add('v'),60);pill.textContent=P[i].b||end;pill.style.display=P[i].b||i==n-1?'':'none';skip.style.display=i>=2?'':'none'};
 const adv=()=>{if(full||busy)return;if(i>=n-1){fin();return}busy=true;s.classList.remove('v');setTimeout(()=>{i++;put();busy=false},700)};
 pill.onclick=adv;IN.onclick=e=>{if(!e.target.closest('button'))adv()};
 skip.onclick=()=>{full=true;skip.remove();body.textContent='';body.classList.add('scroll');const t=mk('div','itx'),e=mk('button','ib',end);P.forEach((p,k)=>{t.append(mk('div','ip',p.t));if(p.b&&k<n-1)t.append(mk('div','ip mw','（'+p.b+'）'))});e.onclick=fin;body.append(t,e)};
 body.append(s,pill);IN.append(skip,body);put()}
/* 說說畫面：未讀＝上方長條卡（新的在上）；已讀＝右下角小方塊（先讀的在最右下，往左、往上排）；沒有未讀信時上方是空的 */
function renderMail(){const el=$('#mail'),bx=$('#mbox');el.textContent='';bx.textContent='';$('#mailP').scrollTop=0;bx.style.display=mv==0?'flex':'none';
 if(mv==0){const A=S.mail.list.filter(m=>mailLetter(m.id));
  A.filter(m=>!m.r).sort((a,b)=>b.t-a.t).forEach(m=>{const l=mailLetter(m.id),r=mk('button','mrow mun'),t=mk('span','mtx');t.append(mk('span',0,l.title[0]),mk('span',0,l.title[1]));r.append(t);r.onclick=()=>openLetter(m.id);el.append(r)});
  A.filter(m=>m.r).sort((a,b)=>(a.ro||0)-(b.ro||0)).forEach(m=>{const l=mailLetter(m.id),r=mk('button','mbx');r.append(mk('span',0,l.title[0]),mk('span',0,l.title[1]));r.onclick=()=>openLetter(m.id);bx.append(r)})}
 else if(mv==1)introStart(1);
 else introFull(el,INTRO.replay2,INTRO.replay2Btn,()=>{mailRead(mailCur||'welcome');mv=0;go('main')})}
/* 送花之後那三行：一整塊出現，按「請繼續說」進星空 */
/* 最後那三行：沒有按鈕。字慢慢浮現 → 停一下讓人讀完 → 畫面慢慢暗掉 → 切到星空，再從黑慢慢亮起來
   時間要調就改這兩個數字：READ＝停多久才開始變暗(ms)，DARK＝變暗花多久(ms，要跟 .idk 的 3.2s 一致) */
function introAfter(){IN.textContent='';const READ=5500,DARK=3200,body=mk('div','ibody'),s=mk('div','istep',INTRO.after.trim()),dk=mk('div','idk');
 body.append(s);IN.append(body,dk);setTimeout(()=>s.classList.add('v'),60);
 setTimeout(()=>dk.classList.add('on'),READ);
 setTimeout(()=>{const d=mk('div','idk2');document.body.append(d);IN.classList.remove('on');go('main');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),2600)}))},READ+DARK+200)}
/* 按下「我看看什麼好東西」：存永久標記、記下果實計時起點、送 id 1 */
function introGive(){
 S.intro=1;S.fr.start=Date.now();/* ← 果實三天延遲的起點（見 CONFIG.fruitDelayMs） */
 S.own[1]=(S.own[1]||0)+1;if(shownTotal()<CONFIG.tankMax)S.show[1]=(S.show[1]||0)+1;
 save();play('open');card(byId(1),true);
 const w=setInterval(()=>{if($('#card').style.display=='none'){clearInterval(w);introAfter()}},200)}
/* 第一次進來：逐句（點一下才換下一句）；上方「不要囉嗦」→ 整頁一次顯示 */
function introStart(rp){/* rp=1 表示從「說說」重看：不發花，最後按鈕是「我好像拿過花花了」，按下進第二頁 */
 IN.textContent='';IN.classList.add('on');
 const parts=[INTRO.title].concat(INTRO.first.trim().split(/\n\s*\n/)),skip=mk('button','ib isk',INTRO.skip),body=mk('div','ibody'),
  s=mk('div','istep'),cont=mk('button','ib',INTRO.cont),give=mk('button','ib',rp?INTRO.replayBtn:INTRO.btn);
 let i=0,busy=false,full=false;const ai=parts.findIndex(p=>p.startsWith(INTRO.askAt));/* ai＝「你知道這裡有什麼嗎」那一句的順序：到這句才出現右上角的不要囉嗦 */
 give.onclick=rp?()=>{IN.classList.remove('on');mv=2;renderMail()}:introGive;
 const put=()=>{s.textContent=parts[i];s.className='istep'+(i==0?' tt':'');setTimeout(()=>s.classList.add('v'),60);cont.textContent=i==ai?INTRO.cont2:INTRO.cont;cont.style.display=(i==1||i==ai)&&i<parts.length-1?'':'none';skip.style.display=i>=ai?'':'none';give.style.display=i==parts.length-1?'':'none'};
 body.append(s,cont,give);IN.append(skip,body);put();
 skip.onclick=()=>{full=true;skip.remove();body.textContent='';body.classList.add('scroll');body.append(mk('div','itx',INTRO.title+'\n\n'+INTRO.first.trim()),give);give.style.display=''};
 const adv=()=>{if(full||busy||i>=parts.length-1)return;busy=true;s.classList.remove('v');setTimeout(()=>{i++;put();busy=false},700)};
 cont.onclick=adv;/* 「請繼續說」按鈕本身也要能換下一句 */
 IN.onclick=e=>{if(!e.target.closest('button'))adv()}}
/* 只出現一次：已有花的舊存檔視為看過，不補花 */
if(!S.intro){if(Object.values(S.own).some(n=>n>0)){S.intro=1;save()}else introStart()}
/* ═══════════════════════ 開場區結束 ═══════════════════════ */
sky();recover();setInterval(recover,60000);loop();requestAnimationFrame(tick);
mailCheck();setInterval(mailCheck,1000);
</script></body></html>
